<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wavium Editor</title>
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>

  <div id="topbar">
    <div class="left">
      <input type="file" id="fileInput" accept="audio/*">
    </div>

    <div class="center controls">
      <button id="playBtn" class="btn">Play</button>
      <button id="stopBtn" class="btn ghost">Stop</button>

      <div style="width:1px; height:28px; background:rgba(255,255,255,0.03)"></div>

      <label class="wave-meta" style="margin-right:8px">Gain</label>
      <input id="gainSlider" class="slider" type="range" min="0" max="300" value="100" />

      <button id="applyGainBtn" class="btn">Apply</button>

      <div style="width:1px; height:28px; background:rgba(255,255,255,0.03)"></div>

      <label class="wave-meta">Fade (s)</label>
      <input id="fadeInInput" type="number" min="0" step="0.1" value="1.0" style="width:70px; padding:8px; border-radius:6px; background:transparent; border:1px solid rgba(255,255,255,0.03); color:var(--muted)">

      <button id="fadeInBtn" class="btn">Fade In</button>
      <input id="fadeOutInput" type="number" min="0" step="0.1" value="1.0" style="width:70px; padding:8px; border-radius:6px; background:transparent; border:1px solid rgba(255,255,255,0.03); color:var(--muted)">
      <button id="fadeOutBtn" class="btn">Fade Out</button>

      <div style="width:1px; height:28px; background:rgba(255,255,255,0.03)"></div>

      <button id="normalizeBtn" class="btn">Normalize</button>
      <button id="exportBtn" class="btn primary">Export WAV</button>
    </div>

    <div class="right">
      <span id="status">Ready</span>
    </div>
  </div>

  <div id="editor">
    <div class="canvas-wrap">
      <div class="wave-header">
        <div>
          <div class="wave-title" id="fileName">No file loaded</div>
          <div class="wave-meta" id="fileInfo">—</div>
        </div>
        <div class="wave-meta" id="timeInfo">00:00 / 00:00</div>
      </div>

      <div class="canvas-area">
        <canvas id="canvas"></canvas>
        <div class="playhead" id="playhead" style="left:0%"></div>
      </div>
    </div>
  </div>

  <div id="bottombar">
    <div id="timeline"><div class="progress" id="progress"></div></div>
    <div class="info-block" id="sampleRate">—</div>
  </div>

  <script src="js/audioLoader.js"></script>
  <script src="js/waveform.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
